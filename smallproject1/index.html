<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Change Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <h1 class="logo">🎨 Color Change Project</h1>

        <button id="refreshBtn">🔄 Refresh</button>
    </header>

    <!-- Main Section -->
    <main class="container">

        <h2>Choose a Background Color</h2>
        <p>Click any color below to change the background.</p>

        <div class="color-grid">

            <span class="button" id="red"></span>
            <span class="button" id="blue"></span>
            <span class="button" id="green"></span>
            <span class="button" id="yellow"></span>
            <span class="button" id="orange"></span>

            <span class="button" id="purple"></span>
            <span class="button" id="pink"></span>
            <span class="button" id="cyan"></span>
            <span class="button" id="brown"></span>
            <span class="button" id="gray"></span>

            <span class="button" id="black"></span>
            <span class="button" id="white"></span>
            <span class="button" id="gold"></span>
            <span class="button" id="lime"></span>
            <span class="button" id="teal"></span>

            <span class="button" id="navy"></span>
            <span class="button" id="maroon"></span>
            <span class="button" id="violet"></span>
            <span class="button" id="coral"></span>
            <span class="button" id="olive"></span>
            <span class="button" id="maron"></span>

        </div>

    </main>

    <script src="index.js"></script>

</body>
</html>
