<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
   <ul class="ul" id="list">
    <li class="l1" id="1">Jagjit singh</li>
    <li class="l1" id="2">Sofware Devloper</li>
     <li class="l1" id="3">IPL</li>
      <li class="l1" id="4"><a href="https://github.com/MatrixEye0">Github</a></li>
   </ul> 

    <ul class="ul2" id="list2">

   </ul>

<script>
// ----------------enent listner -------------
    document.getElementById('list').addEventListener('click',function(e){
        console.log('Clicked UL');  
    },false)/* by default false set automaticaly false and true is event propogation
             false mean bubble propogation mean first inside ul value and upper value like li first and ul 
             in true first ul than li*/
    document.getElementById('2').addEventListener('click',function(e){
        console.log('Clicked SDE ');  
    },false)

     document.getElementById('3').addEventListener('click',function(e){
        console.log('Clicked League '); 
        e.stopPropagation(); // if click now event not go from eneywhere only stick on where you click  only work in false event
    },false)

     document.getElementById('4').addEventListener('click',function(e){
        console.log('Clicked Github '); 
        e.preventDefault(); // if click now no link trigger
    },false)

//-----------true event ------------------

 document.getElementById('list2').addEventListener('click',function(e){
        console.log('Clicked UL');  
    },true)// first ul than li up to down
    document.getElementById('j').addEventListener('click',function(e){
        console.log('Clicked sport '); 
    },true)
   

</script>
